name: Hot Wheels Stock Check

on:
  schedule:
    - cron: "*/1* * * *" # Runs every 1 minutes
  workflow_dispatch:       # Manual test trigger

permissions:
  contents: write          # Allows GitHub Actions to update seen.json

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium

      - name: Run FirstCry catalog scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python checker.py

      - name: Save seen.json state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Update seen stock"
          git push
