name: QCom Sync Task

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests playwright
          playwright install chromium

      - name: Run QCom scanner
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python qcom_checker.py

      - name: Save seen_qcom.json
        run: |
          if [ -f seen_qcom.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add seen_qcom.json
            if ! git diff --staged --quiet; then
              git commit -m "Update qcom state"
              git pull --rebase origin main
              git push
            fi
          else
            echo "seen_qcom.json not created (0 cards loaded), skipping git push."
          fi
